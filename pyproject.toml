[project]
name = "t1000-charting"
version = "0.1.0"
description = "Sovereign telemetry and scientific visualization suite for T-1000 Quantum Engine"
authors = [{ name = "Terrence A. Jones SR" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
# The compiled engine as a Python package, built from crates/t1000_py (needs a Rust toolchain).
engine = ["t1000"]
# Feature extraction and classical baselines (scripts/data/extract_birds_features.py and others).
ml = ["torch>=2.14", "torchvision>=0.29", "scikit-learn>=1.9"]

[tool.uv.sources]
t1000 = { path = "crates/t1000_py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
