[workspace]
members = [
    "crates/t1000_core",
    "crates/t1000",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Terrence A. Jones SR"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tariqselassie-hub/T1000"

[workspace.dependencies]
t1000_core = { path = "crates/t1000_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
thiserror = "2.0"
