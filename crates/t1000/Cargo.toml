[package]
name = "t1000"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "T-1000 Quantum Neural Network: Shape-shifting, high-performance AVX2 quantum simulation, circuit compilation, and molecular SMILES latent exploration."

[lints]
workspace = true

[dependencies]
t1000_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

