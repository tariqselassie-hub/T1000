name: T-1000 CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Lint & Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Test Suite
        run: cargo test --workspace --verbose

  lab-tests:
    name: Lab bench tests (number theory, geometry, algorithms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Number theory
        run: node web/test_lab_nt.js

      - name: Geometry
        run: node web/test_lab_geom.js

      - name: Algorithms, probability and walks
        run: python web/test_lab_api.py
